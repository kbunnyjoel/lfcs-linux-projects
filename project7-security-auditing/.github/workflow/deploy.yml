name: Deploy (Docker Hub)

on:
  workflow_run:
    workflows: ["CI (bats)"]
    branches: ["main"]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
