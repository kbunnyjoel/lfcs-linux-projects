name: Deploy (Docker Hub)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    name: Build and push images to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Linux Projects/lfcs-linux-projects/project7-security-auditing
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push dev image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: dev
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/project7-sec:dev
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/project7-sec:${{ github.sha }}-dev

      - name: Build and push systemd image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: runtime-systemd
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/project7-sec:systemd
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/project7-sec:${{ github.sha }}-systemd

