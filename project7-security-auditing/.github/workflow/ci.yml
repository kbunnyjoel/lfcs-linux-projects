name: CI (bats)

on:
  push:
    branches: [ "**" ]
  pull_request:
  schedule:
    - cron: '0 2 * * *'

jobs:
  tests:
    name: Run bats tests in Docker (dev stage)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: Linux Projects/lfcs-linux-projects/project7-security-auditing

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev image (includes bats + tests)
        run: |
          docker build --target dev -t project7-sec-dev .

      - name: Build runtime-systemd image (for scan)
        run: |
          docker build --target runtime-systemd -t project7-sec-systemd .

      - name: Run shellcheck lint (non-blocking)
        run: |
          docker run --rm -v "$PWD":/app -w /app project7-sec-dev bash -lc "shellcheck src/*.sh || true"

      - name: Run shfmt check (non-blocking)
        run: |
          docker run --rm -v "$PWD":/app -w /app project7-sec-dev bash -lc "shfmt -d src || true"

      # the dev stage’s CMD runs: bats -r tests
      - name: Run test suite
        run: |
          docker run --rm project7-sec-dev

      - name: Print image details (debug)
        if: always()
        run: docker image ls project7-sec*

      - name: Docker Scout quickview (informational)
        uses: docker/scout-action@v1
        continue-on-error: true
        with:
          command: quickview
          image: project7-sec-dev

      - name: Docker Scout quickview (systemd image)
        uses: docker/scout-action@v1
        continue-on-error: true
        with:
          command: quickview
          image: project7-sec-systemd

      - name: Docker Scout quickview (save)
        continue-on-error: true
        run: |
          docker scout quickview project7-sec-dev > "Linux Projects/lfcs-linux-projects/project7-security-auditing/scout-quickview.txt" || true
          docker scout quickview project7-sec-systemd > "Linux Projects/lfcs-linux-projects/project7-security-auditing/scout-quickview-systemd.txt" || true

      - name: Upload Scout quickview artifact (dev)
        if: ${{ hashFiles('Linux Projects/lfcs-linux-projects/project7-security-auditing/scout-quickview.txt') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: scout-quickview
          path: Linux Projects/lfcs-linux-projects/project7-security-auditing/scout-quickview.txt
      - name: Upload Scout quickview artifact (systemd)
        if: ${{ hashFiles('Linux Projects/lfcs-linux-projects/project7-security-auditing/scout-quickview-systemd.txt') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: scout-quickview-systemd
          path: Linux Projects/lfcs-linux-projects/project7-security-auditing/scout-quickview-systemd.txt
      - name: Trivy image scan (SARIF) — dev image
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: project7-sec-dev
          format: sarif
          output: trivy-results-dev.sarif
          vuln-type: 'os,library'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
      - name: Upload SARIF (dev) to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results-dev.sarif

      - name: Trivy image scan (SARIF) — systemd image
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: project7-sec-systemd
          format: sarif
          output: trivy-results-systemd.sarif
          vuln-type: 'os,library'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
      - name: Upload SARIF (systemd) to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results-systemd.sarif
