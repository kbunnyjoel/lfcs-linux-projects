name: CI (bats)

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  tests:
    name: Run bats tests in Docker (dev stage)
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev image (includes bats + tests)
        run: |
          docker build --target dev -t project6-fs-dev .

      # the dev stage’s CMD runs: bats -r tests
      - name: Run test suite
        run: |
          docker run --rm project6-fs-dev

      - name: Print image details (debug)
        if: always()
        run: docker image ls project6-fs-dev
